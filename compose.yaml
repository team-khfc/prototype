name: secureflow-prototype

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped

  backend:
    profiles: [full]
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: container
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    init: true
    restart: unless-stopped
