name: securityadvisor-prototype
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_DB: securityadvisor
      POSTGRES_USER: boan_migrator
      POSTGRES_PASSWORD: ${SA_MIGRATION_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_DB_PASSWORD: ${SA_DB_PASSWORD:?Run python3 scripts/init-demo.py}
    ports:
      - "127.0.0.1:${SA_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/01-app-role.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
      - ./scripts/db/02-pgvector.sql:/docker-entrypoint-initdb.d/02-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boan_migrator -d securityadvisor"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    profiles: [app]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SA_BIND_ADDRESS: 0.0.0.0
      SA_DB_URL: jdbc:postgresql://db:5432/securityadvisor
      SA_DB_USER: boan_app
      SA_DB_PASSWORD: ${SA_DB_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_MIGRATION_USER: boan_migrator
      SA_MIGRATION_PASSWORD: ${SA_MIGRATION_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_CONTEXT_KEY: ${SA_CONTEXT_KEY:?Run python3 scripts/init-demo.py}
      SA_DEMO_ENABLED: "true"
      SA_DEMO_APPLICANT_PASSWORD: ${SA_DEMO_APPLICANT_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_DEMO_SECURITY_PASSWORD: ${SA_DEMO_SECURITY_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_DEMO_INFRA_PASSWORD: ${SA_DEMO_INFRA_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_DEMO_ADMIN_PASSWORD: ${SA_DEMO_ADMIN_PASSWORD:?Run python3 scripts/init-demo.py}
      SA_OPENAI_API_KEY: ${SA_OPENAI_API_KEY:-}
      SA_GEMMA_API_KEY: ${SA_GEMMA_API_KEY:-}
      SA_ALLOWED_LLM_ENDPOINTS: ${SA_ALLOWED_LLM_ENDPOINTS:-https://api.openai.com/v1/chat/completions,https://generativelanguage.googleapis.com/v1beta/models/gemma-4-26b-a4b-it:generateContent}
      SA_UPLOAD_DIRECTORY: /var/lib/securityadvisor/uploads
    ports:
      - "127.0.0.1:${SA_API_PORT:-8080}:8080"
    volumes:
      - uploaded_documents:/var/lib/securityadvisor/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    security_opt: [no-new-privileges:true]
  frontend:
    profiles: [app]
    build:
      context: ./frontend
      args:
        SA_API_ORIGIN: http://backend:8080
    environment:
      NODE_ENV: production
      SA_API_ORIGIN: http://backend:8080
    ports:
      - "127.0.0.1:${SA_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
  uploaded_documents:

