server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  servlet:
    session:
      timeout: 20m
      cookie:
        name: SA_SESSION
        http-only: true
        secure: true
        same-site: strict
spring:
  application:
    name: security-advisor
  jackson:
    deserialization:
      fail-on-null-for-primitives: true
  datasource:
    url: ${SA_DB_URL:jdbc:postgresql://localhost:5432/securityadvisor}
    username: ${SA_DB_USER:boan_app}
    password: ${SA_DB_PASSWORD}
  flyway:
    user: ${SA_MIGRATION_USER:boan_migrator}
    password: ${SA_MIGRATION_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  mvc:
    problemdetails:
      enabled: true
securityadvisor:
  demo:
    enabled: ${SA_DEMO_ENABLED:false}
  context-key: ${SA_CONTEXT_KEY}
  upload-directory: ${SA_UPLOAD_DIRECTORY:/var/lib/securityadvisor/uploads}
  allowed-llm-endpoints: ${SA_ALLOWED_LLM_ENDPOINTS:https://api.openai.com/v1/chat/completions,https://generativelanguage.googleapis.com/v1beta/models/gemma-4-26b-a4b-it:generateContent}
logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.security: WARN
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    supported-submit-methods: []
    disable-swagger-default-url: true

